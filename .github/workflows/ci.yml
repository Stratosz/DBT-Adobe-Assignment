name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint && npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Dependency audit (production dependencies, high and above)
        run: npm run audit:prod

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t feed-intake:ci .
      - name: Smoke test
        run: |
          docker run -d --name feed -p 3000:3000 -e ALLOW_DEMO_KEYS=true feed-intake:ci
          for i in $(seq 1 30); do curl -sf localhost:3000/ready && break; sleep 1; done
          curl -sf localhost:3000/ready
          curl -sf -H 'Authorization: Bearer demo-uploader-key' localhost:3000/api/partners > /dev/null
          docker logs feed | tail -5
